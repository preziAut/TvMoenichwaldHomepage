<section id="tournament-panel" class="tournament-panel" hidden>
  <header class="tournament-intro">
    <div>
      <p class="eyebrow">Vereinsbewerbe</p>
      <h2>Turniere</h2>
      <p id="tournament-location"></p>
    </div>
    <button class="primary" id="new-tournament" type="button" aria-expanded="false" aria-controls="tournament-editor" hidden>Turnier anlegen</button>
  </header>
  <form id="tournament-editor" class="tournament-editor" hidden>
    <div class="tournament-fields">
      <label>Name des Turniers <input name="title" required maxlength="100"></label>
      <label>Bewerb <select name="format"><option value="single">Einzelmeisterschaft</option><option value="mixed">Mixed-Doppel</option></select></label>
    </div>
    <label>Teilnehmer oder Teams <textarea name="entries" rows="4" required maxlength="2400" aria-describedby="tournament-hint"></textarea></label>
    <p id="tournament-hint">2 bis 12 Einträge, einer pro Zeile. Beim Mixed beide Namen mit / trennen. Jeder spielt gegen jeden, über einen Satz.</p>
    <button class="primary">Spielplan erstellen</button>
  </form>
  <p id="tournament-feedback" role="status"></p>
  <div id="tournament-list"></div>
</section>
