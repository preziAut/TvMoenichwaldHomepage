name: Website checks
on:
  push:
  pull_request:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist
      - name: Trigger daily Cloudflare rebuild
        if: github.event_name == 'schedule'
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          fi
